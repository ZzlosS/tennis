version: "3.7"

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - 8787:8787
    environment:
      REDIS_URL: redis://redis_stack:6379
      # Docker Compose reads these from .env (see example.env).
      # Required: the app stops at startup with a clear message if it is empty.
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      redis_stack:
        condition: service_healthy

  redis_stack:
    image: redis/redis-stack:7.4.0-v3
    ports:
      - '6379:6379'
      - '8001:8001'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Throwaway Redis for `npm test`: port 6380, no volume, wiped on restart.
  redis_test:
    image: redis/redis-stack-server:7.4.0-v3
    ports:
      - '6380:6379'

volumes:
  redis_data:
    external: false
