name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v3
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the committed spec is up to date
        run: |
          npm run spec
          git diff --exit-code -- openapi src/generated || { echo "Run npm run spec and commit the result."; exit 1; }
      - name: Upload the spec
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-v1
          path: openapi/v1.json

  breaking-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare the spec with main
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if ! git cat-file -e origin/main:openapi/v1.json 2>/dev/null; then
            echo "main has no spec yet, nothing to compare."; exit 0
          fi
          git show origin/main:openapi/v1.json > /tmp/main-v1.json
          docker run --rm -v /tmp:/tmp -v "$PWD:/w" tufin/oasdiff:latest breaking /tmp/main-v1.json /w/openapi/v1.json --fail-on ERR > /tmp/breaking.txt || status=$?
          cat /tmp/breaking.txt
          if [ "${status:-0}" != 0 ]; then
            if echo ",$LABELS," | grep -q ",api-breaking,"; then echo "Breaking, but labelled api-breaking."; exit 0; fi
            echo "Breaking API change. Add the api-breaking label if this is intended."; exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tennis-api .
      - name: Start the image with Redis and wait for /health
        run: |
          docker network create tennis
          docker run -d --name redis --network tennis redis/redis-stack-server:7.4.0-v3
          docker run -d --name api --network tennis -p 8787:8787 \
            -e REDIS_URL=redis://redis:6379 \
            -e JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret-1234 \
            tennis-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
      - name: Check the container reports healthy
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          docker logs api
          exit 1
